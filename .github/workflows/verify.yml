name: Verify app and engine
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
      - run: bun install --frozen-lockfile
      - run: bun run engine:build
      - run: cargo +1.90.0 build --manifest-path engine/frozenight/Cargo.toml --locked --release -p upapawn-engine --bin frozenight-reference
      - run: node scripts/engine-notices.mjs
      - run: bun run check && bun run test && bun run build
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-verification
          path: artifacts/frozenight/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: bun install --frozen-lockfile
      - run: bun run cap:sync
      - run: ./gradlew :app:assembleDebug --console=plain
        working-directory: android
      - run: node scripts/verify-native-assets.mjs --android
