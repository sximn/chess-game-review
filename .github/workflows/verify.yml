name: Verify app

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
      - run: bun run check && bun run test && bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-verification
          path: artifacts/app-verification/

  browser:
    name: Browser (${{ matrix.browser }})
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/

      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - run: bun run test:browser --project=${{ matrix.browser }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-verification-${{ matrix.browser }}
          path: |
            artifacts/app-verification/
            test-results/

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/

      - run: bun run cap:sync

      - run: ./gradlew :app:assembleDebug --console=plain
        working-directory: android

      - run: node scripts/verify-native-assets.mjs --android

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-verification-android
          path: artifacts/app-verification/
